services:
  postgres:
    image: postgres:16-alpine
    container_name: payp-postgres
    environment:
      POSTGRES_DB: payp
      POSTGRES_USER: payp
      POSTGRES_PASSWORD: payp
    ports:
      - "5432:5432"
    volumes:
      - payp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payp -d payp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  payp-pgdata:

server:
  port: 8090

spring:
  jackson:
    # JSON uses snake_case (access_token, fx_rate, created_at) like real payment APIs.
    property-naming-strategy: SNAKE_CASE
    # Don't serialize null fields (e.g. completed_at before settlement).
    default-property-inclusion: non_null

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payp}
    username: ${DB_USER:payp}
    password: ${DB_PASSWORD:payp}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the mapping against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true

payout:
  # Fake "API clients" allowed to request a token (client_id: client_secret).
  clients:
    demo-client: demo-secret
  # How long an issued access token stays valid.
  token-ttl-seconds: 3600
  # Webhook signing + where completed-payout events are delivered.
  webhook:
    secret: whsec_demo_123
    # For the demo we deliver to our OWN receiver so you can watch the full loop.
    callback-url: http://localhost:8090/webhooks/payouts
    # Reject webhooks whose timestamp is older than this (replay protection).
    tolerance-seconds: 300
  # How long after creation a payout flips PROCESSING -> COMPLETED (simulates settlement).
  status-flip-delay-seconds: 5
  # Starting balance granted to each client on boot (so there are funds to pay out).
  seed-balance: 100000.00
  seed-currency: USD
  # Flat demo FX table. Key is "<from>_<to>".
  fx:
    USD_PEN: 3.742
    EUR_PEN: 4.050
    USD_USD: 1.0

logging:
  level:
    com.arana.payout: INFO
